name: ARGUS CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 0'  # weekly e2e regen gate
  workflow_dispatch:

jobs:
  fast:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m pytest -m "not e2e" -v

  e2e:
    runs-on: windows-latest
    # Full regen is slower (generator + train on ~3k windows); weekly + on demand.
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[e2e]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m pytest -m e2e -v
