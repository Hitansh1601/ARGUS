# ARGUS central config — single source for paths, model, alerting, eval.
data:
  synthetic: data/raw/synthetic/all_synthetic_telemetry.jsonl
  features: data/processed/argus_features.csv
  model: models/argus_xgboost.json
  results_dir: results

model:
  n_estimators: 250
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.9
  colsample_bytree: 0.9
  objective: binary:logistic
  eval_metric: logloss
  random_state: 42
  n_jobs: 1            # >1 is ~100x slower on Windows/OpenMP here
  tree_method: hist

alerting:
  threshold: 0.5
  severities: [LOW, MEDIUM, HIGH, CRITICAL]

eval:
  test_size: 0.25
  benign_holdout: 0.30
  random_state: 42
